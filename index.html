<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>gpa planner</title>
<style>
*,*::placeholder{text-transform:lowercase!important}
:root{--bg:#F5F4ED;--bg2:#EFE6DA;--card:#FFFFFF99;--solid:#FAF9F5;--ink:#141413;--mut:#8A8778;--line:#E6DFD0;--acc:#C96442;--accs:#C9644218;--acc2:#7C8DA6;--ok:#4C7A4F;--bad:#B3402F;--warn:#B07A1E;--sh:0 1px 2px #0000000a,0 10px 30px #7a5a3a14;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1F1E1D;--bg2:#2B2624;--card:#30302E99;--solid:#30302E;--ink:#FAF9F5;--mut:#9A978C;--line:#44433F;--acc:#D97757;--accs:#D9775722;--acc2:#8FA0BA;--ok:#8DB88F;--bad:#E07B67;--warn:#D9A441;--sh:0 1px 2px #0005,0 10px 30px #0004;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1F1E1D;--bg2:#2B2624;--card:#30302E99;--solid:#30302E;--ink:#FAF9F5;--mut:#9A978C;--line:#44433F;--acc:#D97757;--accs:#D9775722;--acc2:#8FA0BA;--ok:#8DB88F;--bad:#E07B67;--warn:#D9A441;--sh:0 1px 2px #0005,0 10px 30px #0004;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{background:var(--bg);background-image:radial-gradient(900px 500px at 85% -10%,var(--accs),transparent),linear-gradient(180deg,var(--bg),var(--bg2));background-attachment:fixed;color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,b.n{font-family:Georgia,"Times New Roman",serif;font-weight:500}h1{font-size:34px;margin:0;letter-spacing:-.5px}h2{font-size:22px;margin:0 0 14px}
.w{max-width:1040px;margin:0 auto;padding:28px 16px 8px}header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:22px}
.sub{color:var(--mut);font-size:14px;margin-top:2px}
section{background:var(--card);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:22px;padding:22px;margin-top:18px;box-shadow:var(--sh)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.card{border-radius:16px;padding:14px 16px;background:var(--solid);border:1px solid var(--line);position:relative;overflow:hidden}.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--acc);opacity:.85}
.card span{color:var(--mut);font-size:12px;text-transform:lowercase;letter-spacing:.06em}.card b.n{display:block;font-size:30px;line-height:1.2;margin-top:2px}.card i{font-style:normal;color:var(--mut);font-size:12px}
.pills{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.pill{cursor:pointer;padding:10px 22px;border-radius:999px;border:1px solid var(--line);background:var(--solid);font:500 18px Georgia,serif;transition:.15s}.pill:hover{border-color:var(--acc)}.pill.on{background:var(--acc);color:#fff;border-color:var(--acc);box-shadow:0 6px 18px var(--accs)}
button,input{font:inherit;color:var(--ink)}button{background:var(--solid);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;transition:.15s}button:hover{border-color:var(--acc);color:var(--acc)}
input[type=text]{background:transparent;border:1px solid transparent;border-bottom-color:var(--line);border-radius:8px;padding:6px 8px;width:64px;text-align:center;transition:.15s}input.nm{width:200px;text-align:left}input[type=text]:hover{background:var(--accs)}input:focus{outline:none;background:var(--solid);border-color:var(--acc)}
input[type=checkbox]{accent-color:var(--acc);width:17px;height:17px}input[type=range]{width:100%;min-width:130px;accent-color:var(--acc)}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:600px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}tr:last-child td{border-bottom:0}th{font-size:11px;color:var(--mut);font-weight:600;text-transform:lowercase;letter-spacing:.06em}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}.mut{color:var(--mut);font-size:13px}.chip{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;background:var(--accs)}
.msg{padding:9px 14px;margin-top:10px;background:var(--accs);border-radius:12px;font-size:14px}
.bar{height:7px;background:var(--line);border-radius:9px;position:relative;min-width:90px}.bar u{position:absolute;left:0;top:0;bottom:0;border-radius:9px;background:var(--acc2)}.bar s{position:absolute;top:-3px;bottom:-3px;width:3px;border-radius:2px;background:var(--acc)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.tools{justify-content:center;margin-top:22px}
#modal{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}#modal[hidden]{display:none}.mb{background:var(--solid);border:1px solid var(--line);border-radius:18px;padding:18px;max-width:520px;width:100%}.p{background:var(--acc);color:#fff;border-color:var(--acc)}textarea{width:100%;height:180px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px}
footer{text-align:center;color:var(--mut);padding:26px 0 30px;font:italic 16px Georgia,serif}
@media print{.noprint,#modal{display:none!important}body{background:#fff;color:#000}}

<div id="modal" hidden><div class="mb"><div id="mc"></div><div class="row" id="mb" style="margin-top:12px"></div></div></div>
<script>
const KEY="gpa-planner-v2";
const DEF=()=>({subjects:[["Software Engineering",7,null,null],["Artificial Intelligence (AI)",8,8,null],["Image and Video Processing",9,8,43],["Operating Systems (OS)",9,6,44],["LTLS",8,8,null],["AR/VR",8,3.5,37.5],["MAD",5,null,null]].map((a,i)=>({id:i+1,name:a[0],cr:3,m1:a[1],m2:a[2],ica:a[3],exp:75,act:null,inc:true})),scale:[[90,10],[80,9],[70,8],[60,7],[50,6],[40,5]].map(a=>({min:a[0],gp:a[1]})),target:8.5,assumed:40,base:null,nid:8,last:null,theme:null});
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!S||!S.subjects)S=DEF();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const f=(x,d=1)=>x==null||isNaN(x)?"-":String(+x.toFixed(d));
const sg=x=>(x>1e-9?"+":"")+f(x,2);
const E={
 sorted:sc=>[...sc].sort((a,b)=>b.min-a.min),
 agg:(ica,tee)=>ica+tee/2,
 gp(sc,a){for(const r of E.sorted(sc))if(a>=r.min-1e-9)return r.gp;return 0},
 gpa(items){const c=items.reduce((a,i)=>a+i.cr,0);return c>0?items.reduce((a,i)=>a+i.cr*i.gp,0)/c:null},
 levels(sc,ica){const m=new Map();for(const r of E.sorted(sc).concat([{min:0,gp:0}])){const tee=Math.max(0,Math.ceil(2*(r.min-ica)*2-1e-9)/2);if(tee<=100&&(!m.has(r.gp)||m.get(r.gp).tee>tee))m.set(r.gp,{gp:r.gp,min:r.min,tee})}return[...m.values()].sort((a,b)=>b.gp-a.gp)},
 optimize(sc,items,target){
  const n=items.length,sumC=items.reduce((a,i)=>a+i.cr,0);if(!n||sumC<=0)return null;
  const need=target*sumC,L=items.map(i=>E.levels(sc,i.ica)),suf=Array(n+1).fill(0);
  for(let i=n-1;i>=0;i--)suf[i]=suf[i+1]+items[i].cr*L[i][0].gp;
  let best=null;const pick=[],res={need,sumC,maxGPA:suf[0]/sumC,achievable:suf[0]>=need-1e-9,plan:null,maxPlan:L.map((l,k)=>({id:items[k].id,gp:l[0].gp,tee:l[0].tee,min:l[0].min}))};
  const rec=(i,pts,tee)=>{
   if(pts+suf[i]<need-1e-9)return;if(best&&tee>best.total+1e-9)return;
   if(i===n){const ch=pick.map((l,k)=>({id:items[k].id,gp:l.gp,tee:l.tee,min:l.min})),pk=Math.max(...ch.map(c=>c.tee)),sq=ch.reduce((a,c)=>a+c.tee*c.tee,0);if(!best||tee<best.total-1e-9||(Math.abs(tee-best.total)<=1e-9&&(pk<best.peak||(pk===best.peak&&sq<best.sq-1e-9))))best={choice:ch,total:tee,peak:pk,sq,gpa:pts/sumC};return}
   for(const l of L[i]){pick[i]=l;rec(i+1,pts+items[i].cr*l.gp,tee+l.tee)}};
  rec(0,0,0);res.plan=best;return res}
};
const inc=()=>S.subjects.filter(s=>s.inc&&s.cr>0);
const eff=s=>s.ica??S.assumed;
const gpExp=s=>E.gp(S.scale,E.agg(eff(s),s.exp??0));
const items=()=>inc().map(s=>({id:s.id,cr:s.cr,ica:eff(s)}));
const inp=(s,k,max)=>`<input type="text" inputmode="decimal" placeholder="${k==="ica"?"?":"-"}" data-i="${s.id}" data-k="${k}" data-max="${max}" value="${s[k]??""}">`;
function comp(excl){
 const I=inc(),sumC=I.reduce((a,s)=>a+s.cr,0),cur=new Map(I.map(s=>[s.id,{s,gp:gpExp(s),tee:s.exp??0,t0:s.exp??0}]));
 let pts=[...cur.values()].reduce((a,c)=>a+c.s.cr*c.gp,0);const goal=S.target*sumC;
 while(pts<goal-1e-9){let b=null;
  for(const c of cur.values()){if(c.s.id===excl)continue;for(const l of E.levels(S.scale,eff(c.s)).filter(l=>l.gp>c.gp)){const cost=Math.max(0,l.tee-c.tee),gain=c.s.cr*(l.gp-c.gp),r=cost/gain;if(!b||r<b.r)b={c,l,r,gain}}}
  if(!b)return{ok:false};b.c.gp=b.l.gp;b.c.tee=Math.max(b.c.tee,b.l.tee);pts+=b.gain}
 return{ok:true,steps:[...cur.values()].filter(c=>c.tee>c.t0)}}
function build(){
 $("wi").innerHTML="<tr><th>Use</th><th>Subject</th><th>Credits</th><th>ICA /50</th><th colspan='2' style='width:30%'>Expected TEE /100</th><th>TEE ÷ 2 /50</th><th>Final /100</th><th>Grade pt</th><th>Change</th></tr>"+S.subjects.map(s=>`<tr><td><input type="checkbox" data-i="${s.id}" data-k="inc" ${s.inc?"checked":""}></td><td>${s.name}</td><td>${inp(s,"cr",30)}</td><td><input type="text" inputmode="decimal" class="ic" placeholder="Enter ICA" data-i="${s.id}" data-k="ica" data-max="50" value="${s.ica??""}"></td><td><input type="range" min="0" max="100" step="0.5" data-i="${s.id}" data-k="exp" data-max="100" value="${s.exp??0}"></td><td>${inp(s,"exp",100)}</td><td id="wa${s.id}"></td><td id="wf${s.id}"></td><td id="wg${s.id}"></td><td id="wd${s.id}"></td></tr>`).join("");
 update()}
function update(){
 save();const I=inc(),sumC=I.reduce((a,s)=>a+s.cr,0),miss=I.filter(s=>s.ica==null),msgs=[];
 $("tg").innerHTML=[8,8.5,9].map(t=>`<div class="pill ${S.target===t?"on":""}" data-act="tgt" data-v="${t}">${t}</div>`).join("")+`<span class="mut" style="margin-left:6px">custom</span><input type="text" inputmode="decimal" data-k="target" id="ct" value="${S.target}">`;
 S.subjects.filter(s=>s.inc&&!(s.cr>0)).forEach(s=>msgs.push(`${s.name}: credits must be above 0, so it is skipped.`));
 if(!I.length||sumC<=0){$("cards").innerHTML="<div class='msg'>Add at least one included subject with credits.</div>";$("req").innerHTML=$("wis").innerHTML="";$("msgs").innerHTML=msgs.map(m=>`<div class="msg">${m}</div>`).join("");return}
 const opt=E.optimize(S.scale,items(),S.target),pm=new Map((opt.plan?opt.plan.choice:opt.maxPlan).map(c=>[c.id,c]));
 const proj=E.gpa(I.map(s=>({cr:s.cr,gp:gpExp(s)}))),known=!miss.length;
 const maxB=I.reduce((a,s)=>a+s.cr*E.levels(S.scale,s.ica??50)[0].gp,0)/sumC;
 const meet=I.filter(s=>s.ica!=null&&pm.get(s.id).tee<=(s.exp??0)).length;
 const cd=(t,v,sub)=>`<div class="card"><span>${t}</span><b class="n">${v}</b><i>${sub||"&nbsp;"}</i></div>`;
 $("cards").innerHTML=cd("Target",f(S.target,2))+cd("Projected",known?f(proj,2):"Enter ICA",known?"from expected TEE":`about ${f(proj,2)} if missing ICA = ${S.assumed}`)+cd("Vs target",known?sg(proj-S.target):"-",known?(proj>=S.target-1e-9?"target met":"below target"):"")+cd("On track",`${meet} / ${I.length}`,"subjects")+cd("Missing ICA",miss.length,miss.length?"results conditional":"all entered")+cd("Max GPA",(miss.length?"≤ ":"")+f(maxB,2),"best possible");
 if(S.target<0||S.target>10)msgs.push("Target must be between 0 and 10.");
 if(!opt.achievable)msgs.push(`GPA ${f(S.target,2)} is not achievable. Even with 100 in every TEE, the most you can reach is ${f(opt.maxGPA,2)}.`);
 $("msgs").innerHTML=msgs.map(m=>`<div class="msg">${m}</div>`).join("");
 let h="<tr><th>Subject</th><th>ICA</th><th>Grade pt</th><th>Required TEE</th><th>Final needed /100</th><th style='width:24%'>Expected vs required</th><th>Status</th></tr>";
 I.forEach(s=>{const c=pm.get(s.id),e=s.exp??0,mi=s.ica==null;h+=`<tr><td>${s.name}</td><td><input type="text" inputmode="decimal" class="ic" placeholder="Enter ICA" data-i="${s.id}" data-k="ica" data-max="50" value="${s.ica??""}"></td><td>${c.gp}</td><td><b>${mi?"~":""}${f(c.tee)}</b></td><td>${f(c.min)}</td><td><div class="bar"><u style="width:${e}%"></u><s style="left:${Math.min(c.tee,100)}%"></s></div></td><td class="${mi?"warn":e>=c.tee?"ok":"bad"}">${mi?"Conditional":e>=c.tee?"On track":"Needs +"+f(c.tee-e)}</td></tr>`});
 $("req").innerHTML=h;
 if(!S.base)S.base=Object.fromEntries(S.subjects.map(s=>[s.id,s.exp]));
 const gb=E.gpa(I.map(s=>({cr:s.cr,gp:E.gp(S.scale,E.agg(eff(s),S.base[s.id]??s.exp??0))})));
 S.subjects.forEach(s=>{const a=$("wa"+s.id);if(!a)return;const t=s.exp??0,ag=E.agg(eff(s),t),g=E.gp(S.scale,ag),bg=E.gp(S.scale,E.agg(eff(s),S.base[s.id]??s.exp??0)),m=s.ica==null?"~":"";a.textContent=f(t/2,1);$("wf"+s.id).textContent=m+f(ag,1);$("wg"+s.id).textContent=g;$("wd"+s.id).innerHTML=g===bg?"<span class=mut>-</span>":`<span class="${g>bg?"ok":"bad"}">${g>bg?"+":""}${g-bg} pts</span>`});
 const need=S.target*sumC-proj*sumC;let w=`<div class="grid" style="margin-top:14px">`+cd("Projected GPA",f(proj,2),known?"":"conditional")+cd("Change",sg(proj-gb),"vs baseline")+cd("Vs target",sg(proj-S.target),"")+cd("Points short",need>1e-9?f(need,1):"0","credit-weighted")+`</div>`;
 if(need<=1e-9)w+=`<div class="msg ok">Your expected marks reach the target.</div>`;
 else{let r=comp(S.last);if(!r.ok&&S.last!=null)r=comp(null);
  if(r.ok)w+=r.steps.map(c=>`<div class="msg"><b>${c.s.name}</b>: raise to about ${f(c.tee)} TEE (+${f(c.tee-c.t0)}) for grade point ${c.gp}</div>`).join("");
  else w+=`<div class="msg bad">Raising other subjects cannot reach this target. Max GPA is ${f(opt.maxGPA,2)}.</div>`}
 w+=`<div class="row noprint" style="margin-top:10px"><button data-act="base">Set baseline to current marks</button></div>`;$("wis").innerHTML=w}
function num(t,max){let v=t.value.replace(/[^0-9.]/g,"");const p=v.split(".");if(p.length>2)v=p[0]+"."+p.slice(1).join("");if(v!==""&&v!=="."&&+v>max)v=String(max);if(t.value!==v)t.value=v;return v===""||v==="."?null:+v}
function onIn(e){const t=e.target,k=t.dataset.k;if(!k)return;
 if(k==="target"){S.target=num(t,10)??0;return update2()}
 const s=S.subjects.find(x=>x.id===+t.dataset.i);if(!s)return;
 if(k==="inc")s.inc=t.checked;else if(k==="name")s.name=t.value.slice(0,40);else{s[k]=num(t,+t.dataset.max);if(k==="exp")S.last=s.id}
 document.querySelectorAll(`[data-k="${k}"][data-i="${s.id}"]`).forEach(x=>{if(x!==t&&k!=="inc")x.value=s[k]??""});
 if(k==="inc"||k==="name")build();else{const inReq=!!t.closest("#req");update();if(inReq){const n=document.querySelector(`#req [data-k="${k}"][data-i="${s.id}"]`);if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}}}}
function update2(){const v=$("ct").value;update();const c=$("ct");c.value=v;c.focus()}
document.addEventListener("input",onIn);document.addEventListener("change",e=>{if(e.target.type==="checkbox")onIn(e)});
function modal(html,btns){$("mc").innerHTML=html;$("mb").innerHTML="";btns.forEach(b=>{const x=document.createElement("button");x.textContent=b[0];if(b[2])x.className="p";x.onclick=()=>{$("modal").hidden=true;b[1]&&b[1]()};$("mb").appendChild(x)});$("modal").hidden=false}
function csv(){const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;return[["Subject","Credits","MTT-1","MTT-2","ICA","Expected TEE","Actual TEE","Included","Expected aggregate","Expected grade pt"].map(q).join(",")].concat(S.subjects.map(s=>[s.name,s.cr,s.m1,s.m2,s.ica,s.exp,s.act,s.inc,s.ica==null?"":f(E.agg(s.ica,s.exp??0),2),s.ica==null?"":E.gp(S.scale,E.agg(s.ica,s.exp??0))].map(q).join(","))).join("\n")}
document.addEventListener("click",e=>{const t=e.target.closest("[data-act]");if(!t)return;const a=t.dataset.act,i=+t.dataset.i;
 if(a==="tgt"){S.target=+t.dataset.v;update()}
 else if(a==="theme"){const d=document.documentElement,cur=d.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");d.dataset.theme=S.theme=cur==="dark"?"light":"dark";save()}
 else if(a==="add"){S.subjects.push({id:S.nid++,name:"New subject",cr:3,m1:null,m2:null,ica:null,exp:75,act:null,inc:true});build()}
 else if(a==="del"){S.subjects=S.subjects.filter(s=>s.id!==i);build()}
 else if(a==="base"){S.base=null;update()}
 else if(a==="reset")modal("Reset everything to the defaults?",[["Cancel"],["Reset",()=>{S=DEF();build()},1]]);
 else if(a==="clear")modal("Clear all marks and subjects? This cannot be undone.",[["Cancel"],["Clear all",()=>{S.subjects=[];S.base=null;build()},1]]);
 else if(a==="csv"){modal(`<b>CSV export</b><textarea id="cv" readonly></textarea>`,[["Copy",()=>{try{navigator.clipboard.writeText(csv())}catch(e){}}],["Close",null,1]]);$("cv").value=csv()}
 else if(a==="print"){try{window.print()}catch(e){modal("Printing is blocked here. Use your browser’s print command.",[["OK"]])}}});
if(S.theme)document.documentElement.dataset.theme=S.theme;
function greet(){if(S.name)$("sub").textContent="Welcome, "+S.name+". Know exactly what you need in every TEE"}
function enter(){const v=$("nm").value.trim();if(!v){$("nm").focus();return}S.name=v.slice(0,30);save();greet();document.body.classList.remove("intro");const i=$("intro");i.classList.add("out");setTimeout(()=>i.classList.remove("show","out"),750)}
$("go").onclick=enter;$("nm").addEventListener("keydown",e=>{if(e.key==="Enter")enter()});
if(!S.name){document.body.classList.add("intro");$("intro").classList.add("show");setTimeout(()=>$("nm").focus(),50)}else greet();
build();
